# Builds Anything installers for Windows, macOS and Linux, and the
# Studio's separate download.
#
# - Every push to main and every manual run: builds all three and uploads the
#   installers as workflow artifacts (Actions → the run → Artifacts).
# - A tag like v0.6.0: also publishes them on a GitHub Release.
#
# The builds are unsigned (no Apple/Microsoft signing keys): Windows shows a
# SmartScreen prompt and macOS needs right-click → Open the first time.

name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            # windows-latest ships Visual Studio 2026, which the Office's node-gyp
            # (for its native modules) doesn't recognize yet.
            os: windows-2022
            bundles: nsis
            artifacts: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS (Apple silicon)
            os: macos-latest
            bundles: app,dmg
            artifacts: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifacts: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev file patchelf pkg-config \
            libasound2-dev libayatana-appindicator3-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            libdbus-1-dev desktop-file-utils squashfs-tools xdg-utils

      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target

      - name: Desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Office (build, UI, runtime)
        shell: bash
        run: |
          cd office
          # Skip install scripts: they'd compile the native modules for the
          # runner's Node (which on Windows needs Clang tools). Fetch Electron,
          # then the Office's own postinstall rebuilds them for Electron.
          npm ci --ignore-scripts
          node node_modules/electron/install.js
          npm run postinstall
          npm run build
          # An absolute outDir: the config's root is src/sidecar-web, so a
          # relative one landed in office/src/desktop/... and the installers
          # shipped without the Office ("Not Found").
          npx vite build --config sidecar.web.vite.config.ts --outDir "$GITHUB_WORKSPACE/desktop/public/office-app" --emptyOutDir
          cd ..
          test -f desktop/public/office-app/index.html || { echo "the Office UI wasn't built into desktop/public/office-app"; exit 1; }
          node scripts/stage-office-runtime.mjs

      - name: Helper binaries
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cargo build --release -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          else
            cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          fi
          ./scripts/bundle-sidecars.sh

      # What lets an installed app host servers on its own computer: the
      # relay, a portable Postgres and a self-contained Garnet (the cache),
      # bundled under hosting/ (see desktop/src-tauri/src/hosting_kit.rs).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Hosting kit
        shell: bash
        env:
          POSTGRES_VERSION: "17.4.1"
          GARNET_VERSION: "v2.2.4"
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) triple=x86_64-pc-windows-msvc; rid=win-x64; ext=.exe ;;
            macOS)   triple=aarch64-apple-darwin;   rid=osx-arm64; ext= ;;
            Linux)   triple=x86_64-unknown-linux-gnu; rid=linux-x64; ext= ;;
          esac
          kit=desktop/src-tauri/hosting-kit
          rm -rf "$kit" && mkdir -p "$kit/relay" "$kit/postgres" "$kit/garnet"

          cargo build --release -p buzz-relay
          cp "target/release/buzz-relay$ext" "$kit/relay/"

          curl -fsSL -o pg.tar.gz             "https://github.com/theseus-rs/postgresql-binaries/releases/download/$POSTGRES_VERSION/postgresql-$POSTGRES_VERSION-$triple.tar.gz"
          mkdir pg-unpacked && tar -xzf pg.tar.gz -C pg-unpacked
          pg_bin="$(dirname "$(find pg-unpacked -type f -name "postgres$ext" -path '*/bin/*' | head -1)")"
          pg_root="$(dirname "$pg_bin")"
          for part in bin lib share; do
            [[ -d "$pg_root/$part" ]] && cp -R "$pg_root/$part" "$kit/postgres/"
          done
          rm -rf pg.tar.gz pg-unpacked
          for tool in postgres initdb pg_ctl; do
            test -f "$kit/postgres/bin/$tool$ext" || { echo "missing $tool"; exit 1; }
          done

          git clone --quiet --depth 1 --branch "$GARNET_VERSION" https://github.com/microsoft/garnet.git garnet-src
          dotnet publish garnet-src/main/GarnetServer/GarnetServer.csproj -c Release -f net10.0 -r "$rid"             --self-contained             -o "$kit/garnet"
          rm -rf garnet-src
          # Garnet embeds files that need debug symbols to build; ship it without them.
          find "$kit/garnet" -name "*.pdb" -delete
          test -f "$kit/garnet/GarnetServer$ext" || { echo "missing GarnetServer"; exit 1; }
          du -sh "$kit"/*
          # The AppImage packager inspects every program in the bundle and
          # fails on the kit's libraries: Linux ships the kit zipped, and the
          # app unpacks it on first use (hosting_kit.rs).
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            (cd "$kit" && zip -qr -9 ../hosting-kit.zip .)
            rm -rf "$kit" && mkdir -p "$kit"
            mv desktop/src-tauri/hosting-kit.zip "$kit/kit.zip"
            du -sh "$kit/kit.zip"
          fi

      - name: Build the app
        shell: bash
        run: |
          cd desktop
          pnpm tauri build --ci --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      # Plain lower-case names for downloads:
      # anything_<version>_<arch>.<ext>.
      - name: Name the installers
        shell: bash
        run: |
          shopt -s nullglob
          for f in desktop/src-tauri/target/release/bundle/*/Anything_*; do
            [[ -f "$f" ]] || continue
            base="$(basename "$f")"
            mv "$f" "$(dirname "$f")/anything_${base#Anything_}"
          done
          ls desktop/src-tauri/target/release/bundle/*/

      - uses: actions/upload-artifact@v4
        with:
          name: anything-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # The Studio's UI is not in the installers: the app downloads it on demand
  # from the release (studio-app-<version>.zip, checked against its .sha256).
  studio:
    name: Studio download
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build the Studio UI
        env:
          ARTCRAFT_BASE: /studio-app/
        run: |
          cd studio/frontend
          npm ci
          cd apps/artcraft
          npx vite build --outDir "$GITHUB_WORKSPACE/desktop/studio-dist/studio-app" --emptyOutDir
      - name: Package it
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          mkdir -p out
          (cd desktop/studio-dist && zip -qr "../../out/studio-app-${version}.zip" studio-app)
          (cd out && sha256sum "studio-app-${version}.zip" > "studio-app-${version}.zip.sha256")
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: anything-studio
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, studio]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
