# Builds Kenn's Harness installers for Windows, macOS and Linux, and the
# Studio's separate download.
#
# - Every push to main and every manual run: builds all three and uploads the
#   installers as workflow artifacts (Actions → the run → Artifacts).
# - A tag like v0.6.0: also publishes them on a GitHub Release.
#
# The builds are unsigned (no Apple/Microsoft signing keys): Windows shows a
# SmartScreen prompt and macOS needs right-click → Open the first time.

name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            # windows-latest ships Visual Studio 2026, which the Office's node-gyp
            # (for its native modules) doesn't recognize yet.
            os: windows-2022
            bundles: nsis
            artifacts: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS (Apple silicon)
            os: macos-latest
            bundles: app,dmg
            artifacts: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifacts: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev file patchelf pkg-config \
            libasound2-dev libayatana-appindicator3-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            libdbus-1-dev desktop-file-utils squashfs-tools xdg-utils

      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target

      - name: Desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Office (build, UI, runtime)
        shell: bash
        run: |
          cd office
          # Skip install scripts: they'd compile the native modules for the
          # runner's Node (which on Windows needs Clang tools). Fetch Electron,
          # then the Office's own postinstall rebuilds them for Electron.
          npm ci --ignore-scripts
          node node_modules/electron/install.js
          npm run postinstall
          npm run build
          npx vite build --config sidecar.web.vite.config.ts --outDir ../desktop/public/office-app --emptyOutDir
          cd ..
          node scripts/stage-office-runtime.mjs

      - name: Helper binaries
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cargo build --release -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          else
            cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          fi
          ./scripts/bundle-sidecars.sh

      - name: Build the app
        shell: bash
        run: |
          cd desktop
          pnpm tauri build --ci --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      # Plain names for downloads (the product name has a ’, awkward in a
      # terminal): kenns-harness_<version>_<arch>.<ext>.
      - name: Name the installers
        shell: bash
        run: |
          shopt -s nullglob
          for f in desktop/src-tauri/target/release/bundle/*/Kenn*Harness_*; do
            [[ -f "$f" ]] || continue
            base="$(basename "$f")"
            mv "$f" "$(dirname "$f")/kenns-harness_${base#*Harness_}"
          done
          ls desktop/src-tauri/target/release/bundle/*/

      - uses: actions/upload-artifact@v4
        with:
          name: kenns-harness-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  # The Studio's UI is not in the installers: the app downloads it on demand
  # from the release (studio-app-<version>.zip, checked against its .sha256).
  studio:
    name: Studio download
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build the Studio UI
        env:
          ARTCRAFT_BASE: /studio-app/
        run: |
          cd studio/frontend
          npm ci
          cd apps/artcraft
          npx vite build --outDir ../../../../desktop/studio-dist/studio-app --emptyOutDir
      - name: Package it
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          mkdir -p out
          (cd desktop/studio-dist && zip -qr "../../out/studio-app-${version}.zip" studio-app)
          (cd out && sha256sum "studio-app-${version}.zip" > "studio-app-${version}.zip.sha256")
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: kenns-harness-studio
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, studio]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
