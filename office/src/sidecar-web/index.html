<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Office</title>
    <!-- CSP is set by the host shell (it must allow the sidecar ws:// origin) -->
    <!-- v0.3.4 type revamp: Press Start 2P stays as the BRAND display face
         (small caps labels only); body/UI moves to Inter and code/terminal to
         JetBrains Mono. The pixel body fonts (Pixelify/VT323) read as toy-like
         and strained at data-dense sizes.
         v0.4.6: these three faces are BUNDLED (src/renderer/src/design/fonts.css)
         rather than fetched from fonts.googleapis.com, which is blocked in
         mainland China. The CSP above no longer allows either Google font host. -->
    <style>
      /* Inside Anything the Office loads over the app's own background (the
         floor behind every page), so there is no splash of its own: nothing
         shows until the Office draws, and switching servers never flashes
         another app's loading screen. */
      html, body { background: transparent; }
      #cth-splash { position: fixed; inset: 0; background: transparent; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cth-splash" aria-busy="true"></div>
    </div>
    <script type="module" src="./boot.ts"></script>
  </body>
</html>
