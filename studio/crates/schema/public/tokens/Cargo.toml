[package]
name = "tokens"
edition = "2018"
version = "0.0.1"
authors = [
    "Brandon Thomas <bt@brand.io>",
    "Brandon Thomas <echelon@gmail.com>",
]
publish = false

[lib]
name = "tokens"
path = "src/lib.rs"

[features]
default = []
# `database` (MySQL coders for the backend services) is disabled in this
# copy: sqlx 0.7's optional SQLite dependency conflicts with the rusqlite
# build ArtCraft shares inside Buzz, even when the feature is off.
database = []

[dependencies]

# Internal
# (none)

# Serialization
serde.workspace = true
serde_derive.workspace = true

# Random
rand = {  version = "0.8.5", features = ["std_rng"] }

once_cell.workspace = true


utoipa.workspace = true

[dev-dependencies]

# Enum utilities
strum.workspace = true

# Test serialization
serde_json.workspace = true
