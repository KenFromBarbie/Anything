[package]
name = "sqlite_tasks"
edition = "2024"
version = "0.0.1"
publish = false

[lib]
name = "sqlite_tasks"
path = "src/lib.rs"

[dependencies]

# Internal
enums.workspace = true
errors.workspace = true
tokens.workspace = true

# External
anyhow.workspace = true
chrono.workspace = true
log.workspace = true

# SQLite through rusqlite (was sqlx 0.7). Same version Buzz uses, so one
# libsqlite3-sys links when ArtCraft is built into Buzz.
rusqlite = { version = "0.40", features = ["bundled"] }

# Needed to safety check some queries we can't use escaping for
once_cell.workspace = true
regex.workspace = true

# Serialization
serde.workspace = true
serde_derive.workspace = true
serde_json.workspace = true

[dev-dependencies]
# serial_test = "3.0.0"
tempfile.workspace = true
tokio = { workspace = true, features = ["rt"] }

